name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Lint, typecheck, test and build

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

      # Runs tsc and the Vite bundle. The bundle step is the one that caught
      # the missing workbox-window dependency, which tsc alone cannot see.
      - name: Build
        run: pnpm build
