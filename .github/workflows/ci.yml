name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

# One job per package. All always run: a change to the shared lockfile, the
# workspace files or the contracts package can break either app, and the
# whole suite takes about a minute.
jobs:
  web:
    runs-on: ubuntu-latest
    name: Web - lint, typecheck, test and build

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @tracknstick/web lint

      - name: Test
        run: pnpm --filter @tracknstick/web test:run

      # Runs tsc and the Vite bundle. The bundle step is the one that caught
      # the missing workbox-window dependency, which tsc alone cannot see.
      - name: Build
        run: pnpm --filter @tracknstick/web build

  api:
    runs-on: ubuntu-latest
    name: API - lint, typecheck and test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @tracknstick/api lint

      # The test environment loads the compiled entry point, so the build
      # has to come first.
      - name: Typecheck
        run: pnpm --filter @tracknstick/api build

      - name: Test
        run: pnpm --filter @tracknstick/api test

  contracts:
    runs-on: ubuntu-latest
    name: Contracts - typecheck and test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @tracknstick/contracts build

      - name: Test
        run: pnpm --filter @tracknstick/contracts test
