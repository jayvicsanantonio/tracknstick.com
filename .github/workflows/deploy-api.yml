name: Deploy API to Cloudflare Workers

# Push to main is the only trigger. Merging a pull request already produces
# that push, so a pull_request trigger would deploy each merge a second time,
# and without a base-branch filter would also deploy merges into other branches.
#
# The paths filter keeps frontend-only changes from redeploying the API. The
# lockfile and workspace files are listed because they decide which dependency
# versions the Worker is bundled with.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.node-version'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    environment:
      name: production
      url: https://tracknstick-api.hi-00e.workers.dev

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @tracknstick/api build

      # Deploy is the last gate before production, so the suite runs here too
      # rather than only on pull requests.
      - name: Test
        run: pnpm --filter @tracknstick/api test

      # Bring the production database to the schema this code expects, before
      # the code goes live. Wrangler applies only the migrations the database
      # has not recorded yet. A migration that fails is rolled back and stops
      # the job here, so the Worker is never deployed against a schema it does
      # not expect.
      - name: Apply database migrations
        run: pnpm --filter @tracknstick/api exec wrangler d1 migrations apply tracknstick-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
