# Build-script approvals.
#
# pnpm 10.x moved these out of package.json's "pnpm" field, which newer
# versions ignore with:
#   [WARN] The "pnpm" field in package.json is no longer read by pnpm.
#
# pnpm asks for a true/false per package that wants to run a build script.
# Each of these genuinely needs to: workerd is the Workers runtime wrangler
# executes, esbuild compiles a native binary, and sharp ships platform
# binaries.
allowBuilds:
  '@clerk/shared': true
  esbuild: true
  sharp: true
  workerd: true
