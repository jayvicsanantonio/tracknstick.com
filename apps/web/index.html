    <!-- The launch splash, in the app icon's colours in every theme. Styled
         here so it paints before the app's stylesheet or script arrive;
         useHideSplash fades it out once the app has something to show. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #064d34;
        transition:
          opacity 0.3s ease-out,
          visibility 0.3s;
      }
      #splash.splash-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* 176 pixels for the medallion's 200 units, the size the iOS launch
         images draw its dial at, at the centre of the screen. */
      .splash-medallion {
        width: 176px;
        height: 176px;
        overflow: visible;
        transform-origin: center;
        animation: splash-breathe 2.4s ease-in-out 1.6s infinite;
      }
      .splash-ring,
      .splash-check {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .splash-ring {
        animation: splash-draw 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.15s
          forwards;
      }
      .splash-check {
        animation: splash-draw 0.35s ease-out 0.85s forwards;
      }
      .splash-wordmark {
        position: absolute;
        top: calc(50% + 108px);
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        color: #fbe4f0;
        font-family:
          'Plus Jakarta Sans Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        opacity: 0;
        animation: splash-rise 0.5s ease-out 0.9s forwards;
      }
      @keyframes splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-breathe {
        50% {
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-medallion,
        .splash-ring,
        .splash-check,
        .splash-wordmark {
          animation: none;
        }
        .splash-ring,
        .splash-check {
          stroke-dashoffset: 0;
        }
        .splash-wordmark {
          opacity: 1;
        }
      }
    </style>

        viewBox="0 0 200 200"
        aria-hidden="true"
        focusable="false"

            y1="18"

            <stop offset="0.48" stop-color="#e13d97" />
            <stop offset="1" stop-color="#d8137f" />
          </linearGradient>
          <radialGradient id="splash-dial" cx="0.5" cy="0.42" r="0.6">
            <stop offset="0" stop-color="#fbe4f0" />
            <stop offset="1" stop-color="#fadded" />
          </radialGradient>
          <linearGradient

            y1="49"
            x2="54"
            y2="17"

            <stop offset="1" stop-color="#e869af" />
          </linearGradient>
        </defs>

        <circle

          cy="100"
          r="67"
          fill="none"
          stroke="#f4b7d8"
          stroke-width="0.85"
        />
        <path

          pathLength="1"
          fill="none"
          stroke="url(#splash-ring)"

        />
        <g transform="translate(50 50) scale(1.5625)">

            pathLength="1"
            fill="none"
            stroke="url(#splash-check)"
            stroke-width="8.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </svg>
      <p class="splash-wordmark" aria-hidden="true">Track N' Stick</p>
